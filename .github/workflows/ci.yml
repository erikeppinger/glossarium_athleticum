name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    # The full suite takes about a minute locally; anything near this limit
    # means a test has hung, and the default job limit is six hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Keep in step with the local toolchain (flutter --version).
          flutter-version: 3.47.1
          cache: true

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test

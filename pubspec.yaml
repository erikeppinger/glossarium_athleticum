name: training_app
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.13.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  drift: ^2.34.3
  path_provider: ^2.1.6
  path: ^1.9.1
  drift_flutter: ^0.3.1
  csv: ^8.0.0
  uuid: ^4.6.0
  file_picker: ^12.1.1
  table_calendar: ^3.2.1
  intl: ^0.20.3
  fl_chart: ^1.2.0
  cryptography: ^2.9.0
  share_plus: ^13.3.0
  receive_sharing_intent: 1.8.1
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.5
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  package_info_plus: ^10.2.1
  xml: ^7.0.1
  pdf: ^3.13.0
  archive: 4.0.9
  # Android-only in this app (see lib/features/shared/youtube_embed.dart) -
  # no maintained Windows/Linux Flutter WebView implementation exists, so
  # embedding is guarded to Android and falls back to a thumbnail + external
  # open elsewhere. Depending on it doesn't affect the Windows/Linux builds
  # (federated plugin architecture - see the receive_sharing_intent
  # precedent in CLAUDE.md for the same shape of platform gap).
  youtube_player_iframe: ^6.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.5
  build_runner: ^2.16.0
  # Packages the Windows build as a real MSIX with package identity - the
  # unpackaged .exe this project shipped up to now can't retrieve/cancel its
  # own already-shown notifications (flutter_local_notifications_windows'
  # own documented limitation) and, more seriously, can't be relaunched by
  # tapping a notification at all once fully closed - reported live
  # (2026-09-11): closing the window with a rest timer running left no way
  # back to the session short of finding the .exe again manually. Windows
  # only grants that a real "app identity" (a package, not a bare .exe) can
  # register for.
  msix: ^3.16.11

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # Generates AppLocalizations from lib/l10n/*.arb (see l10n.yaml) - only the
  # Settings > Units & display section is migrated to it so far (see
  # CLAUDE.md's i18n scaffolding note); every other screen still uses plain
  # English string literals pending a dedicated full-migration pass.
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/seed-data/strongman_exercise_database.csv
    - docs/PRIVACY_POLICY.md
    - docs/DISCLAIMER.md
    - docs/THIRD_PARTY_LICENSES.md
    - templates/training_plan_template.csv
    - templates/training_plan_template.xlsx
    - templates/wger_starter_library.csv
    - seed-data/strongman_exercise_database.xlsx

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# Packages the Windows build as an MSIX with real package identity - see the
# `msix` dev_dependency's own comment above for why this was added
# (2026-09-11): an unpackaged .exe can't be relaunched by tapping its own
# toast notification once fully closed, and can't cancel/query its own
# already-shown notifications either. `toast_activator.clsid` is
# deliberately the exact same GUID already used as
# `WindowsInitializationSettings.guid` in notification_service.dart -
# msix registers this as the packaged app's COM notification activator, and
# the plugin uses it at runtime to identify itself; the two have to match or
# activation silently fails. Not published to the Microsoft Store (`store`
# left at its default `false`) - this is signed with the tool's own
# auto-generated self-signed test certificate for informal (Dropbox)
# distribution, per its own default behavior. Anyone installing this on a
# machine other than the one that built it needs to trust that certificate
# first (see CLAUDE.md's Windows build/ship notes) - Add-AppxPackage will
# otherwise refuse to install it.
msix_config:
  display_name: Training App
  publisher_display_name: Erik Eppinger
  identity_name: TrainingApp.Local
  logo_path: windows\runner\resources\app_icon.ico
  toast_activator:
    clsid: "9de9e982-6bf6-4a1b-9aab-b8b4c2f0e3a3"
    arguments: "----AppNotificationActivationServer"
    display_name: "Training App"
